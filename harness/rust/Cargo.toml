[package]
name = "temporalio-features-harness"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
temporalio-client = "0.8"
temporalio-common = "0.8"
temporalio-sdk = "0.8"
temporalio-sdk-core = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
