name: Build all language docker images
# TODO: Add SDK repo-ref inputs for languages other than Go and Rust.
on:
  workflow_call:
    inputs:
      go-ver:
        description: Go SDK ver to build. Skipped if not specified. Must start with v.
        type: string
      go-repo-ref:
        description: Go SDK repo ref to build. Mutually exclusive with go-ver.
        type: string
      py-ver:
        description: Python SDK ver to build. Skipped if not specified. Must start with v.
        type: string
      php-ver:
        description: PHP SDK ver to build. Skipped if not specified. Must start with v.
        type: string
      ts-ver:
        description: TypeScript SDK ver to build. Skipped if not specified. Must start with v.
        type: string
      java-ver:
        description: Java SDK ver to build. Skipped if not specified. Must start with v.
        type: string
      cs-ver:
        description: .NET SDK ver to build. Skipped if not specified. Must start with v.
        type: string
      rb-ver:
        description: Ruby SDK ver to build. Skipped if not specified. Must start with v.
        type: string
      rs-ver:
        description: Rust SDK release to build. Must start with v. Mutually exclusive with rs-repo-ref.
        type: string
      rs-repo-ref:
        description: Rust SDK source ref to build. Mutually exclusive with rs-ver.
        type: string
      rs-repo-url:
        description: Rust SDK source URL override (default temporalio/sdk-rust).
        type: string
      do-push:
        description: If set, push the built images to Docker Hub.
        type: boolean
        default: false
      skip-cloud:
        description: If set, skip running cloud tests.
        type: boolean
        default: false
  # To support manual triggering:
  # AFAICT there is no way to avoid repeating all these inputs over and over w/o resorting to templating
  workflow_dispatch:
    inputs:
      go-ver:
        description: Go SDK ver to build. Skipped if not specified. Must start with v.
        type: string
      go-repo-ref:
        description: Go SDK repo ref to build. Mutually exclusive with go-ver.
        type: string
      py-ver:
        description: Python SDK ver to build. Skipped if not specified. Must start with v.
        type: string
      php-ver:
        description: PHP SDK ver to build. Skipped if not specified.
        type: string
      ts-ver:
        description: TypeScript SDK ver to build. Skipped if not specified. Must start with v.
        type: string
      java-ver:
        description: Java SDK ver to build. Skipped if not specified. Must start with v.
        type: string
      cs-ver:
        description: .NET SDK ver to build. Skipped if not specified. Must start with v.
        type: string
      rb-ver:
        description: Ruby SDK ver to build. Skipped if not specified. Must start with v.
        type: string
      rs-ver:
        description: Rust SDK release to build. Must start with v. Mutually exclusive with rs-repo-ref.
        type: string
      rs-repo-ref:
        description: Rust SDK source ref to build. Mutually exclusive with rs-ver.
        type: string
      rs-repo-url:
        description: Rust SDK source URL override (default temporalio/sdk-rust).
        type: string
      do-push:
        description: If set, push the built images to Docker Hub.
        type: boolean
        default: false
      skip-cloud:
        description: If set, skip running cloud tests.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-go-docker-images:
    if: inputs.go-ver || inputs.go-repo-ref
    uses: ./.github/workflows/docker-images.yaml
    secrets: inherit
    with:
      lang: go
      sdk-version: ${{ inputs.go-ver }}
      sdk-repo-ref: ${{ inputs.go-repo-ref }}
      semver-latest: major
      do-push: ${{ inputs.do-push }}
      skip-cloud: ${{ inputs.skip-cloud }}

  build-ts-docker-images:
    if: inputs.ts-ver
    uses: ./.github/workflows/docker-images.yaml
    secrets: inherit
    with:
      lang: ts
      sdk-version: ${{ inputs.ts-ver }}
      semver-latest: major
      do-push: ${{ inputs.do-push }}
      skip-cloud: ${{ inputs.skip-cloud }}

  build-java-docker-images:
    if: inputs.java-ver
    uses: ./.github/workflows/docker-images.yaml
    secrets: inherit
    with:
      lang: java
      sdk-version: ${{ inputs.java-ver }}
      semver-latest: major
      do-push: ${{ inputs.do-push }}
      skip-cloud: ${{ inputs.skip-cloud }}

  build-python-docker-images:
    if: inputs.py-ver
    uses: ./.github/workflows/docker-images.yaml
    secrets: inherit
    with:
      lang: py
      sdk-version: ${{ inputs.py-ver }}
      semver-latest: major
      do-push: ${{ inputs.do-push }}
      skip-cloud: ${{ inputs.skip-cloud }}

  build-php-docker-images:
    if: inputs.php-ver
    uses: ./.github/workflows/docker-images.yaml
    secrets: inherit
    with:
      lang: php
      sdk-version: ${{ inputs.php-ver }}
      semver-latest: major
      do-push: ${{ inputs.do-push }}
      skip-cloud: ${{ inputs.skip-cloud }}

  build-dotnet-docker-images:
    if: inputs.cs-ver
    uses: ./.github/workflows/docker-images.yaml
    secrets: inherit
    with:
      lang: cs
      sdk-version: ${{ inputs.cs-ver }}
      semver-latest: major
      do-push: ${{ inputs.do-push }}
      skip-cloud: ${{ inputs.skip-cloud }}

  build-rb-docker-images:
    if: inputs.rb-ver
    uses: ./.github/workflows/docker-images.yaml
    secrets: inherit
    with:
      lang: rb
      sdk-version: ${{ inputs.rb-ver }}
      semver-latest: major
      do-push: ${{ inputs.do-push }}
      skip-cloud: ${{ inputs.skip-cloud }}

  build-rs-docker-images:
    if: inputs.rs-ver || inputs.rs-repo-ref
    uses: ./.github/workflows/docker-images.yaml
    secrets: inherit
    with:
      lang: rs
      sdk-version: ${{ inputs.rs-ver }}
      sdk-repo-ref: ${{ inputs.rs-repo-ref }}
      sdk-repo-url: ${{ inputs.rs-repo-url }}
      semver-latest: major
      do-push: ${{ inputs.do-push }}
      skip-cloud: ${{ inputs.skip-cloud }}
