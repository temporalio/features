name: Build docker images
on:
  workflow_call:
    inputs:
      lang:
        description: SDK language to build the container for
        required: true
        type: string
      platforms:
        description: Architectures to build and publish, as a JSON list
        type: string
        default: '["amd64","arm64"]'
      sdk-repo-ref:
        description: Git ref of SDK repo to use to build (overrides "sdk-version")
        required: false
        type: string
      sdk-repo-url:
        description: URL of SDK repo to use to build (only used if "sdk-repo-ref" is provided)
        required: false
        type: string
      sdk-version:
        description: Version of SDK to use (ignored if "sdk-repo-ref" is provided)
        required: false
        type: string
      semver-latest:
        description: Tag images with major / minor versions (only used if "sdk-version" is provided - 'minor' or 'major')
        type: string
        default: 'none'
      do-push:
        description: If set, push the built image to Docker Hub.
        type: boolean
        default: false
      skip-cloud:
        description: If set, skip running cloud tests.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-image:
    name: Build ${{ inputs.lang }} docker image (${{ matrix.arch }})
    # Each platform builds and tests natively; the publish job joins them under one tag.
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      TEMPORAL_CLOUD_ADDRESS: sdk-ci.a2dd6.tmprl.cloud:7233
      TEMPORAL_CLOUD_NAMESPACE: sdk-ci.a2dd6
      REPO_URL: ${{ github.event.pull_request.head.repo.html_url }}
    steps:
      - name: Fail if both sdk-version and sdk-repo-ref are present
        if: inputs.sdk-version && inputs.sdk-repo-ref
        run: exit 1
      - name: Print build information
        run: 'echo head_ref: "$GITHUB_HEAD_REF", ref: "$GITHUB_REF"'
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - name: Lint dockerfile
        env:
          INPUT_LANG: ${{ inputs.lang }}
        run: docker run --rm -i hadolint/hadolint < "dockerfiles/$INPUT_LANG.Dockerfile"

      # Download the certs to be mounted as a volume in the running container
      - name: Download certs to temporary directory
        run: |
          mkdir /tmp/temporal-certs &&
          echo "$TEMPORAL_CLIENT_CERT" > /tmp/temporal-certs/client.pem &&
          echo "$TEMPORAL_CLIENT_KEY" > /tmp/temporal-certs/client.key &&
          wc /tmp/temporal-certs/client.pem /tmp/temporal-certs/client.key
        env:
          TEMPORAL_CLIENT_CERT: ${{ secrets.TEMPORAL_CLIENT_CERT }}
          TEMPORAL_CLIENT_KEY: ${{ secrets.TEMPORAL_CLIENT_KEY }}

      - name: Login to DockerHub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        if: inputs.do-push
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        if: inputs.do-push
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # This step will set the FEATURES_BUILT_IMAGE_TAG env key
      - name: Build docker image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_LANG: ${{ inputs.lang }}
          INPUT_SDK_REPO_REF: ${{ inputs.sdk-repo-ref }}
          INPUT_SDK_REPO_URL: ${{ inputs.sdk-repo-url }}
          INPUT_SDK_VERSION: ${{ inputs.sdk-version }}
          INPUT_SEMVER_LATEST: ${{ inputs.semver-latest }}
          DO_PUSH: ${{ inputs.do-push }}
          ARCH: ${{ matrix.arch }}
        run: |
          args=(--lang "$INPUT_LANG" --platform "linux/$ARCH")
          if [ -n "$INPUT_SDK_REPO_REF" ]; then
            args+=(--repo-ref "$INPUT_SDK_REPO_REF")
            if [ -n "$INPUT_SDK_REPO_URL" ]; then
              args+=(--repo-url "$INPUT_SDK_REPO_URL")
            fi
          else
            args+=(--version "$INPUT_SDK_VERSION")
          fi
          if [ "$INPUT_SEMVER_LATEST" != "none" ]; then
            args+=(--semver-latest "$INPUT_SEMVER_LATEST")
          fi
          if [ "$DO_PUSH" = true ]; then
            args+=(--push-to temporaliotest --metadata-file "$RUNNER_TEMP/image.json")
          fi
          go run . build-image "${args[@]}"

      - name: Resolve image to test
        env:
          DO_PUSH: ${{ inputs.do-push }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="$FEATURES_BUILT_IMAGE_TAG"
          if [ "$DO_PUSH" = true ]; then
            jq -e --arg tags "$FEATURES_BUILT_IMAGE_TAGS" \
              '{digest: ."containerimage.digest", tags: ($tags | split(";") | map("temporaliotest/" + .))}
               | select(.digest | test("^sha256:[0-9a-f]{64}$"))' \
              "$RUNNER_TEMP/image.json" > "$RUNNER_TEMP/image-$ARCH.json"
            digest=$(jq -er '.digest' "$RUNNER_TEMP/image-$ARCH.json")
            image="temporaliotest/${FEATURES_BUILT_IMAGE_TAG%%:*}@$digest"
          fi
          echo "FEATURES_TEST_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Test with Dev Server
        run: docker run --rm -i -v /tmp/temporal-certs:/certs "$FEATURES_TEST_IMAGE"

      - name: Test with Cloud
        # Only supported in non-fork runs. One platform is enough to check the cloud connection.
        if: ${{ matrix.arch == 'amd64' && (github.event.pull_request.head.repo.full_name == '' || github.event.pull_request.head.repo.full_name == 'temporalio/features') && !inputs.skip-cloud }}
        run: |
          max_attempts=3
          attempt=0
          until [ $attempt -ge $max_attempts ]
          do
            docker run --rm -i \
            -v /tmp/temporal-certs:/certs \
            --env TEMPORAL_FEATURES_DISABLE_WORKFLOW_COMPLETION_CHECK=true \
            "$FEATURES_TEST_IMAGE" \
            --server "$TEMPORAL_CLOUD_ADDRESS" \
            --namespace "$TEMPORAL_CLOUD_NAMESPACE" \
            --client-cert-path /certs/client.pem \
            --client-key-path /certs/client.key && break

            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts failed. Retrying..."
            sleep 5
          done

          if [ $attempt -ge $max_attempts ]; then
            echo "Failed after $max_attempts attempts"
            exit 1
          fi

      - name: Upload image metadata
        if: inputs.do-push
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: features-image-${{ inputs.lang }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 7

  publish-image:
    name: Publish ${{ inputs.lang }} docker image
    needs: build-image
    if: inputs.do-push
    runs-on: ubuntu-latest
    steps:
      - name: Download image metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: features-image-${{ inputs.lang }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/image

      - name: Login to DockerHub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tag the multi-platform image
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          cd "$RUNNER_TEMP/image"
          expected_files=$(jq -ce '
            select(type == "array" and length > 0
              and all(.[]; . == "amd64" or . == "arm64")
              and (unique | length) == length)
            | map("image-" + . + ".json") | sort' <<< "$PLATFORMS")
          shopt -s nullglob
          files=(*)
          actual_files=$(printf '%s\n' "${files[@]}" | jq -Rsc 'split("\n")[:-1] | sort')
          if [ "$actual_files" != "$expected_files" ]; then
            echo "Expected image metadata files $expected_files, found $actual_files" >&2
            exit 1
          fi
          jq -es '
            all(.[]; (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))
              and (.tags | type == "array" and length > 0
                and all(.[]; type == "string" and test("^temporaliotest/features:[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$"))))
            and ([.[].digest] | unique | length) == length
            and (.[0].tags as $tags | all(.[]; .tags == $tags))' "${files[@]}"
          tag_lines=$(jq -er '.tags[]' "${files[0]}")
          mapfile -t tags <<< "$tag_lines"
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done
          images=()
          for file in "${files[@]}"; do
            digest=$(jq -er '.digest' "$file")
            images+=("temporaliotest/features@$digest")
          done
          docker buildx imagetools create "${tag_args[@]}" "${images[@]}"
